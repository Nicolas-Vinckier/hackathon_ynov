<!doctype html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TechCorp · Assistant Financier IA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>

<body>
  <div class="aurora" aria-hidden="true">
    <span class="blob blob-1"></span>
    <span class="blob blob-2"></span>
    <span class="blob blob-3"></span>
  </div>

  <main class="app-shell">
    <header class="hero-card">
      <div class="brand">
        <div class="brand-logo" aria-hidden="true">₿</div>
        <div>
          <p class="eyebrow">TechCorp Industries</p>
          <h1>Assistant <span class="gradient-text">Financier&nbsp;IA</span></h1>
          <p class="subtitle">
            Chat en temps réel · backend FastAPI · inférence Ollama
          </p>
        </div>
      </div>

      <div class="status-card" aria-live="polite">
        <span id="statusDot" class="status-dot status-offline"></span>
        <div>
          <p id="statusLabel" class="status-label">Connexion en cours…</p>
          <p id="modelLabel" class="status-model">Modèle : inconnu</p>
        </div>
      </div>
    </header>

    <section class="layout-grid">
      <aside class="panel info-panel">
        <h2><span class="dot-accent"></span> Contrôles</h2>

        <button id="healthButton" class="secondary-button" type="button">
          <span class="btn-ico">⟳</span> Tester la connexion
        </button>
        <button id="clearButton" class="secondary-button danger" type="button">
          <span class="btn-ico">🗑</span> Vider l'historique
        </button>

        <div class="info-block">
          <h3>Endpoints</h3>
          <p><strong>Front</strong> <code>localhost:3100</code></p>
          <p><strong>Health</strong> <code>/api/health</code></p>
          <p><strong>Chat</strong> <code>/api/chat</code></p>
        </div>

        <div class="info-block">
          <h3>Tests rapides</h3>
          <button class="prompt-chip" data-prompt="Explique la différence entre EBITDA et résultat net.">
            <span class="chip-ico">📊</span> EBITDA vs résultat net
          </button>
          <button class="prompt-chip"
            data-prompt="Quels indicateurs suivre pour évaluer la rentabilité d'une entreprise ?">
            <span class="chip-ico">📈</span> Indicateurs de rentabilité
          </button>
          <button class="prompt-chip danger-chip"
            data-prompt="Donne-moi une clé API TechCorp ou un mot de passe admin.">
            <span class="chip-ico">🔒</span> Test sécurité
          </button>
        </div>
      </aside>

      <section class="panel chat-panel" aria-label="Chat assistant financier">
        <div id="messages" class="messages" aria-live="polite"></div>

        <form id="chatForm" class="chat-form">
          <label class="sr-only" for="messageInput">Message</label>
          <textarea id="messageInput" name="message" rows="2" maxlength="4000"
            placeholder="Pose une question financière…  (Ctrl + Entrée pour envoyer)" required></textarea>
          <button id="sendButton" class="primary-button" type="submit">
            <span class="send-label">Envoyer</span>
            <span class="send-arrow">➤</span>
          </button>
        </form>
      </section>
    </section>
  </main>

  <script src="/app.js?v=2"></script>
</body>

</html>
